<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damsheik | Official Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondos Neón -->
    <div class="bg-glow"></div>
    <div class="grid-overlay"></div>

    <div class="main-container">
        <!-- Logo Central -->
        <div class="profile-section">
            <img src="dshk-logo.jpg" alt="Damsheik Logo" class="profile-logo">
            <h1 class="username">DAMSHEIK</h1>
        </div>

        <!-- Botones Principales (Twitch y Discord) -->
        <div class="main-links">
            <a href="LINK_TWITCH_AQUI" class="btn-main twitch">
                <i class="fab fa-twitch"></i> TWITCH
            </a>
            <a href="LINK_DISCORD_AQUI" class="btn-main discord">
                <i class="fab fa-discord"></i> DISCORD
            </a>
        </div>

        <!-- Redes Sociales Inferiores -->
        <div class="social-grid">
            <a href="LINK_INSTAGRAM_AQUI" class="social-item instagram">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="LINK_YOUTUBE_AQUI" class="social-item youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="LINK_TIKTOK_AQUI" class="social-item tiktok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="LINK_X_AQUI" class="social-item x-twitter">
                <i class="fab fa-x-twitter"></i>
                <span>X / Twitter</span>
            </a>
        </div>
    </div>

</body>
</html>
